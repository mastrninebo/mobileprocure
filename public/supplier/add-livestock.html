<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Livestock | Mobile Procure</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="icon" href="../assets/images/logo.png" type="image/png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#F5F7FA;
padding-bottom:100px;
color:#1F2937;
}

header{
background:white;
padding:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 2px 15px rgba(0,0,0,.05);
}

header a{
color:#0F766E;
text-decoration:none;
font-size:20px;
}

header h2{
font-size:22px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.section-title{
color:#0F766E;
margin-bottom:18px;
font-size:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid #E5E7EB;
border-radius:12px;
margin-bottom:18px;
font-size:15px;
outline:none;
}

textarea{
height:120px;
resize:none;
}

.upload{
border:2px dashed #CBD5E1;
border-radius:15px;
padding:35px;
text-align:center;
background:#F8FAFC;
margin-bottom:20px;
}

.upload i{
font-size:40px;
color:#0F766E;
margin-bottom:15px;
}

.upload p{
color:#6B7280;
}

.btn{
display:block;
width:100%;
padding:16px;
background:#0F766E;
color:white;
text-align:center;
text-decoration:none;
border-radius:14px;
font-size:17px;
font-weight:600;
}

.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

background:white;

display:flex;

justify-content:space-around;

padding:15px 0;

box-shadow:0 -5px 20px rgba(0,0,0,.08);

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

gap:5px;

font-size:12px;

text-decoration:none;

color:#9CA3AF;

}

.bottom-nav a.active{

color:#0F766E;

font-weight:600;

}

.bottom-nav i{

font-size:20px;

}

</style>

</head>

<body>

<header>

<a href="inventory.html">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h2>Add Livestock</h2>

</header>

<div class="container">

<div class="card">

<h3 class="section-title">

Livestock Information

</h3>

<label>Category</label>

<select>

<option>Cattle</option>

<option>Goats</option>

<option>Sheep</option>

<option>Pigs</option>

<option>Chickens</option>

</select>

<label>Breed</label>

<input type="text" placeholder="e.g. Angus Bulls">

<label>Quantity</label>

<input type="number" placeholder="200">

<label>Average Weight (kg)</label>

<input type="number" placeholder="450">

<label>Price Per Head (USD)</label>

<input type="number" placeholder="1250">

<label>Farm Location</label>

<input type="text" placeholder="Chisamba, Central Province">

<label>Vaccination Status</label>

<select>

<option>Fully Vaccinated</option>

<option>Partially Vaccinated</option>

<option>Awaiting Inspection</option>

</select>

<label>Description</label>

<textarea placeholder="Describe the livestock..."></textarea>

</div>

<div class="card">

<h3 class="section-title">

Livestock Photos

</h3>

<div class="upload">

<i class="fa-solid fa-cloud-arrow-up"></i>

<h4>Upload Images</h4>

<p>Drag & Drop or Click to Upload</p>

</div>

</div>

<a href="inventory.html" class="btn">

Publish Listing

</a>

</div>

<div class="bottom-nav">

<a href="dashboard.html">
    <i class="fa-solid fa-house"></i>
    Home
</a>

<a href="inventory.html">
    <i class="fa-solid fa-boxes-stacked"></i>
    Inventory
</a>

<a href="orders.html">
    <i class="fa-solid fa-clipboard-list"></i>
    Orders
</a>

<a href="payments.html">
    <i class="fa-solid fa-wallet"></i>
    Escrow
</a>

<a href="profile.html">
    <i class="fa-solid fa-user"></i>
    Profile
</a>

</div>

</body>
</html>
