<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Procure | Supplier Orders</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .left a {
            text-decoration: none;
            color: #0F766E;
            font-size: 20px;
        }

        .left h2 {
            font-size: 22px;
        }

        .filter {
            padding: 20px;
            display: flex;
            gap: 12px;
            overflow: auto;
            scrollbar-width: none;
        }

        .filter::-webkit-scrollbar {
            display: none;
        }

        .filter button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter button.active {
            background: #0F766E;
            color: white;
        }

        .container {
            padding: 0 20px;
        }

        .order-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,.05);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: 600;
            color: #0F766E;
        }

        .status {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .processing { background: #FEF3C7; color: #92400E; }
        .pending { background: #DBEAFE; color: #1D4ED8; }
        .delivered { background: #DCFCE7; color: #166534; }
        .completed { background: #D1FAE5; color: #065F46; }
        .cancelled { background: #FEE2E2; color: #991B1B; }

        .order-card h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .order-card > p {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 15px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .item {
            background: #F8FAFC;
            padding: 12px;
            border-radius: 12px;
        }

        .item small {
            display: block;
            color: #6B7280;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .item strong {
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .buttons a {
            flex: 1;
            padding: 14px;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .view {
            background: #E5E7EB;
            color: #111827;
        }

        .view:hover {
            background: #D1D5DB;
        }

        .manage {
            background: #0F766E;
            color: white;
        }

        .manage:hover {
            background: #0D6B64;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #0F766E;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .empty-state i {
            font-size: 50px;
            color: #0F766E;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 12px;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #0F766E;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('supplier')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <div class="left">
            <a href="dashboard.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2>Supplier Orders</h2>
        </div>
        <i class="fa-solid fa-sliders"></i>
    </header>

    <div class="filter">
        <button class="active" data-filter="all">All</button>
        <button data-filter="processing">Preparing</button>
        <button data-filter="pending">Ready/Pending</button>
        <button data-filter="delivered">Delivered</button>
        <button data-filter="completed">Completed</button>
    </div>

    <div class="container">
        <div id="ordersContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading your orders...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="inventory.html">
            <i class="fa-solid fa-boxes-stacked"></i>
            Inventory
        </a>
        <a href="orders.html" class="active">
            <i class="fa-solid fa-clipboard-list"></i>
            Orders
        </a>
        <a href="payments.html">
            <i class="fa-solid fa-wallet"></i>
            Escrow
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const ordersContainer = document.getElementById('ordersContainer');
        const filterButtons = document.querySelectorAll('.filter button');
        
        let allOrders = [];
        let currentFilter = 'all';

        // Load orders from database
        async function loadOrders() {
            try {
                const user = await getCurrentUser();
                if (!user) return;

                const { data, error } = await supabase
                    .from('orders')
                    .select(`
                        id,
                        order_number,
                        status,
                        total_amount,
                        order_date,
                        buyer:buyer_id (
                            full_name,
                            company_name
                        )
                    `)
                    .eq('supplier_id', user.id)
                    .order('order_date', { ascending: false });

                if (error) throw error;

                allOrders = data || [];
                renderOrders();

            } catch (error) {
                console.error('Error loading orders:', error);
                ordersContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading orders. Please try again.</p>`;
            }
        }

        // Render order cards
        function renderOrders() {
            // Filter orders based on selected tab
            let filteredOrders = allOrders;
            if (currentFilter !== 'all') {
                if (currentFilter === 'processing') {
                    filteredOrders = allOrders.filter(o => ['confirmed', 'escrow_funded', 'shipped'].includes(o.status));
                } else if (currentFilter === 'pending') {
                    filteredOrders = allOrders.filter(o => o.status === 'pending');
                } else {
                    filteredOrders = allOrders.filter(o => o.status === currentFilter);
                }
            }

            if (!filteredOrders || filteredOrders.length === 0) {
                ordersContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-clipboard"></i>
                        <h3>No Orders Found</h3>
                        <p>There are no orders matching this filter right now.</p>
                    </div>
                `;
                return;
            }

            ordersContainer.innerHTML = filteredOrders.map(order => {
                const buyerName = order.buyer?.company_name || order.buyer?.full_name || 'Unknown Buyer';
                const status = order.status || 'pending';
                const formattedDate = new Date(order.order_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                return `
                    <div class="order-card">
                        <div class="top">
                            <div class="order-id">
                                ${order.order_number || 'N/A'}
                            </div>
                            <div class="status ${status}">
                                ${status.replace('_', ' ')}
                            </div>
                        </div>
                        <h3>Order Total: $${Number(order.total_amount || 0).toLocaleString()}</h3>
                        <p><i class="fa-solid fa-user"></i> ${buyerName}</p>
                        <div class="details">
                            <div class="item">
                                <small>Order Date</small>
                                <strong>${formattedDate}</strong>
                            </div>
                            <div class="item">
                                <small>Escrow Status</small>
                                <strong>${status === 'completed' ? 'Released' : 'Secured'}</strong>
                            </div>
                        </div>
                        <div class="buttons">
                            <a href="order-details.html?id=${order.id}" class="view">View Details</a>
                            <a href="order-details.html?id=${order.id}" class="manage">Manage Order</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter button event listeners
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderOrders();
            });
        });

        // Initialize
        loadOrders();
    </script>

</body>
</html>
