<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Details | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F5F7FA; color: #1F2937; padding-bottom: 100px; }
        
        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #0F766E; font-size: 20px; text-decoration: none; }
        header h2 { font-size: 20px; color: #0F766E; }

        .container { padding: 20px; }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .image-gallery {
            width: 100%;
            height: 300px;
            background: #ECECEC;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-gallery img { width: 100%; height: 100%; object-fit: cover; }
        .image-gallery i { font-size: 80px; color: #D1D5DB; }

        .content { padding: 25px; }
        .content h1 { font-size: 24px; margin-bottom: 5px; text-transform: capitalize; }
        .content .location { color: #6B7280; font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .badge.verified { background: #DCFCE7; color: #166534; }
        .badge.pending { background: #FEF3C7; color: #92400E; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .info-box {
            background: #F8FAFC;
            padding: 15px;
            border-radius: 12px;
        }
        .info-box small { display: block; color: #6B7280; font-size: 12px; margin-bottom: 5px; }
        .info-box strong { font-size: 16px; color: #1F2937; }

        .description { margin-bottom: 25px; }
        .description h3 { margin-bottom: 10px; color: #0F766E; font-size: 16px; }
        .description p { color: #4B5563; font-size: 14px; line-height: 1.6; }

        .btn {
            display: block;
            text-align: center;
            padding: 15px;
            background: #0F766E;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { background: #0D6B64; }

        .loading-spinner { text-align: center; padding: 60px 20px; color: #6B7280; }
        .loading-spinner i { font-size: 40px; color: #0F766E; margin-bottom: 15px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; display: flex; justify-content: space-around;
            padding: 15px 0; box-shadow: 0 -5px 20px rgba(0,0,0,.08); z-index: 1000;
        }
        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; font-size: 12px; gap: 5px; color: #9CA3AF;
        }
        .bottom-nav a.active { color: #0F766E; font-weight: 600; }
        .bottom-nav i { font-size: 20px; }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('supplier')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <header>
        <a href="inventory.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Livestock Details</h2>
    </header>

    <div class="container">
        <div id="detailsContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading listing details...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="inventory.html" class="active"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i> Orders</a>
        <a href="payments.html"><i class="fa-solid fa-wallet"></i> Escrow</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </div>

    <script type="module">
        import { supabase } from '../assets/js/supabase-client.js';

        const detailsContainer = document.getElementById('detailsContainer');
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        async function loadListing() {
            if (!itemId) {
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">No Item ID provided.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select('*')
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Listing not found.</p>`;
                    return;
                }

                renderListing(data);
            } catch (error) {
                console.error('Error loading listing:', error);
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading details.</p>`;
            }
        }

        function renderListing(item) {
            const imageSrc = (item.images && item.images.length > 0) ? item.images[0] : null;
            const isVerified = item.certification_status === 'Fully Vaccinated';
            
            detailsContainer.innerHTML = `
                <div class="card">
                    <div class="image-gallery">
                        ${imageSrc ? `<img src="${imageSrc}" alt="${item.breed}">` : `<i class="fa-solid fa-cow"></i>`}
                    </div>
                    <div class="content">
                        <h1>${item.breed || 'Unknown Breed'}</h1>
                        <div class="location">
                            <i class="fa-solid fa-location-dot"></i>
                            ${item.location_name || 'Location not specified'}
                        </div>
                        
                        <span class="badge ${isVerified ? 'verified' : 'pending'}">
                            ${item.certification_status || 'Pending Inspection'}
                        </span>

                        <div class="grid">
                            <div class="info-box">
                                <small>Category</small>
                                <strong style="text-transform:capitalize;">${item.category || 'N/A'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Quantity</small>
                                <strong>${item.quantity || 0} ${item.unit || 'Head'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Avg Weight</small>
                                <strong>${item.weight_kg ? item.weight_kg + ' kg' : 'N/A'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Price Per Unit</small>
                                <strong>$${Number(item.price_per_unit || 0).toLocaleString()}</strong>
                            </div>
                        </div>

                        <div class="description">
                            <h3>Description</h3>
                            <p>${item.description || 'No description provided for this listing.'}</p>
                        </div>

                        <a href="inventory.html" class="btn">
                            <i class="fa-solid fa-pen"></i> Manage Listing
                        </a>
                    </div>
                </div>
            `;
        }

        loadListing();
    </script>
</body>
</html>
