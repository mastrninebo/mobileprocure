<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Details | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F5F7FA; color: #1F2937; padding-bottom: 100px; }
        
        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #0F766E; font-size: 20px; text-decoration: none; }
        header h2 { font-size: 20px; color: #0F766E; }

        .container { padding: 20px; }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .image-gallery {
            width: 100%;
            height: 300px;
            background: #ECECEC;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-gallery img { width: 100%; height: 100%; object-fit: cover; }
        .image-gallery i { font-size: 80px; color: #D1D5DB; }

        .content { padding: 25px; }
        .content h1 { font-size: 24px; margin-bottom: 5px; text-transform: capitalize; }
        .content .location { color: #6B7280; font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .badge.verified { background: #DCFCE7; color: #166534; }
        .badge.pending { background: #FEF3C7; color: #92400E; }
        .badge.inactive { background: #F3F4F6; color: #6B7280; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .info-box {
            background: #F8FAFC;
            padding: 15px;
            border-radius: 12px;
        }
        .info-box small { display: block; color: #6B7280; font-size: 12px; margin-bottom: 5px; }
        .info-box strong { font-size: 16px; color: #1F2937; }

        .description { margin-bottom: 25px; }
        .description h3 { margin-bottom: 10px; color: #0F766E; font-size: 16px; }
        .description p { color: #4B5563; font-size: 14px; line-height: 1.6; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            background: #0F766E;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn:hover { background: #0D6B64; }

        .loading-spinner { text-align: center; padding: 60px 20px; color: #6B7280; }
        .loading-spinner i { font-size: 40px; color: #0F766E; margin-bottom: 15px; }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-sheet {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 40px 20px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-header {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1F2937;
            position: relative;
        }
        
        .sheet-close {
            position: absolute;
            right: 0;
            top: 0;
            background: #F3F4F6;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sheet-option {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 16px;
            background: #F9FAFB;
            border: 1px solid #F3F4F6;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #1F2937;
            transition: 0.2s;
        }

        .sheet-option:hover {
            background: #F3F4F6;
        }

        .sheet-option i {
            width: 24px;
            text-align: center;
            font-size: 18px;
            color: #0F766E;
        }

        .sheet-option.danger {
            color: #DC2626;
        }
        .sheet-option.danger i {
            color: #DC2626;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            animation: slideIn 0.3s ease;
            display: none;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #0F766E; }
        .toast.error { background: #DC2626; }
        .toast.show { display: block; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; display: flex; justify-content: space-around;
            padding: 15px 0; box-shadow: 0 -5px 20px rgba(0,0,0,.08); z-index: 1000;
        }
        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; font-size: 12px; gap: 5px; color: #9CA3AF;
        }
        .bottom-nav a.active { color: #0F766E; font-weight: 600; }
        .bottom-nav i { font-size: 20px; }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('supplier')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <header>
        <a href="inventory.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Livestock Details</h2>
    </header>

    <div class="container">
        <div id="detailsContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading listing details...</p>
            </div>
        </div>
    </div>

    <!-- Manage Listing Modal -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal-sheet">
            <div class="sheet-header">
                Manage Listing
                <button class="sheet-close" onclick="closeManageModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <a href="inventory.html" class="sheet-option">
                <i class="fa-solid fa-pen"></i>
                Edit Listing Details
            </a>

            <button id="toggleAvailabilityBtn" class="sheet-option" onclick="toggleAvailability()">
                <i class="fa-solid fa-eye-slash"></i>
                <span id="toggleText">Mark as Unavailable</span>
            </button>

            <button class="sheet-option danger" onclick="deleteListing()">
                <i class="fa-solid fa-trash"></i>
                Delete Listing Permanently
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><span id="toastMessage"></span></div>

    <div class="bottom-nav">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="inventory.html" class="active"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="orders.html"><i class="fa-solid fa-clipboard-list"></i> Orders</a>
        <a href="payments.html"><i class="fa-solid fa-wallet"></i> Escrow</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </div>

    <script type="module">
        import { supabase } from '../assets/js/supabase-client.js';

        const detailsContainer = document.getElementById('detailsContainer');
        const manageModal = document.getElementById('manageModal');
        const toggleBtn = document.getElementById('toggleAvailabilityBtn');
        const toggleText = document.getElementById('toggleText');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        let currentItem = null;

        // Helper: Show Toast
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Load Listing Data
        async function loadListing() {
            if (!itemId) {
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">No Item ID provided.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select('*')
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Listing not found.</p>`;
                    return;
                }

                currentItem = data;
                renderListing(data);
            } catch (error) {
                console.error('Error loading listing:', error);
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading details.</p>`;
            }
        }

        // Render HTML
        function renderListing(item) {
            const imageSrc = (item.images && item.images.length > 0) ? item.images[0] : null;
            const isVerified = item.certification_status === 'Fully Vaccinated';
            const isAvailable = item.is_available !== false; // Default to true if undefined
            
            // Update Toggle Button Text
            if (isAvailable) {
                toggleText.textContent = 'Mark as Unavailable';
                toggleBtn.querySelector('i').className = 'fa-solid fa-eye-slash';
            } else {
                toggleText.textContent = 'Mark as Available';
                toggleBtn.querySelector('i').className = 'fa-solid fa-eye';
            }

            detailsContainer.innerHTML = `
                <div class="card">
                    <div class="image-gallery">
                        ${imageSrc ? `<img src="${imageSrc}" alt="${item.breed}">` : `<i class="fa-solid fa-cow"></i>`}
                    </div>
                    <div class="content">
                        <h1>${item.breed || 'Unknown Breed'}</h1>
                        <div class="location">
                            <i class="fa-solid fa-location-dot"></i>
                            ${item.location_name || 'Location not specified'}
                        </div>
                        
                        <span class="badge ${isVerified ? 'verified' : 'pending'}">
                            ${item.certification_status || 'Pending Inspection'}
                        </span>

                        ${!isAvailable ? `<span class="badge inactive" style="margin-left:5px;">Hidden</span>` : ''}

                        <div class="grid">
                            <div class="info-box">
                                <small>Category</small>
                                <strong style="text-transform:capitalize;">${item.category || 'N/A'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Quantity</small>
                                <strong>${item.quantity || 0} ${item.unit || 'Head'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Avg Weight</small>
                                <strong>${item.weight_kg ? item.weight_kg + ' kg' : 'N/A'}</strong>
                            </div>
                            <div class="info-box">
                                <small>Price Per Unit</small>
                                <strong>$${Number(item.price_per_unit || 0).toLocaleString()}</strong>
                            </div>
                        </div>

                        <div class="description">
                            <h3>Description</h3>
                            <p>${item.description || 'No description provided for this listing.'}</p>
                        </div>

                        <button class="btn" onclick="openManageModal()">
                            <i class="fa-solid fa-sliders"></i> Manage Listing
                        </button>
                    </div>
                </div>
            `;
        }

        // Modal Controls
        window.openManageModal = () => {
            manageModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeManageModal = () => {
            manageModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        manageModal.addEventListener('click', (e) => {
            if (e.target === manageModal) window.closeManageModal();
        });

        // Toggle Availability
        window.toggleAvailability = async () => {
            if (!currentItem) return;
            
            const newStatus = !(currentItem.is_available !== false);
            
            try {
                const { error } = await supabase
                    .from('inventory_items')
                    .update({ is_available: newStatus })
                    .eq('id', currentItem.id);

                if (error) throw error;

                currentItem.is_available = newStatus;
                showToast(`Listing marked as ${newStatus ? 'Available' : 'Unavailable'}`, 'success');
                
                // Re-render to update badges and button text
                renderListing(currentItem);
                window.closeManageModal();

            } catch (error) {
                console.error('Error updating status:', error);
                showToast('Error updating status: ' + error.message, 'error');
            }
        };

        // Delete Listing
        window.deleteListing = async () => {
            if (!currentItem) return;

            if (!confirm('Are you absolutely sure you want to permanently delete this listing? This action cannot be undone.')) return;

            try {
                const { error } = await supabase
                    .from('inventory_items')
                    .delete()
                    .eq('id', currentItem.id);

                if (error) throw error;

                showToast('Listing deleted successfully. Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'inventory.html';
                }, 1500);

            } catch (error) {
                console.error('Error deleting listing:', error);
                showToast('Error deleting listing: ' + error.message, 'error');
            }
        };

        loadListing();
    </script>
</body>
</html>
