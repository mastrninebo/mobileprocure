<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Procure | Order Details</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            background: #fff;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #0F766E;
            font-size: 20px;
            text-decoration: none;
        }

        header h2 {
            font-size: 22px;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,.05);
        }

        .card h3 {
            margin-bottom: 18px;
            color: #0F766E;
            font-size: 18px;
            border-bottom: 1px solid #ECECEC;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info {
            background: #F8FAFC;
            padding: 14px;
            border-radius: 12px;
        }

        .info small {
            display: block;
            color: #6B7280;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .info strong {
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            background: #DCFCE7;
            color: #166534;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            margin-top: 8px;
            text-transform: capitalize;
        }
        
        .status-badge.processing { background: #FEF3C7; color: #92400E; }
        .status-badge.pending { background: #DBEAFE; color: #1D4ED8; }
        .status-badge.delivered { background: #DCFCE7; color: #166534; }
        .status-badge.completed { background: #D1FAE5; color: #065F46; }
        .status-badge.cancelled { background: #FEE2E2; color: #991B1B; }

        .timeline {
            position: relative;
            padding-left: 25px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #E5E7EB;
        }

        .step {
            position: relative;
            margin-bottom: 25px;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step::before {
            content: "";
            position: absolute;
            left: -22px;
            top: 3px;
            width: 15px;
            height: 15px;
            background: #D1D5DB;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px #D1D5DB;
        }

        .step.completed::before {
            background: #0F766E;
            box-shadow: 0 0 0 1px #0F766E;
        }

        .step small {
            color: #6B7280;
            display: block;
            margin-top: 3px;
            font-size: 12px;
        }

        .step strong {
            font-size: 14px;
            color: #1F2937;
        }
        
        .step.pending strong {
            color: #9CA3AF;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .actions a, .actions button {
            text-decoration: none;
            text-align: center;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .primary {
            background: #0F766E;
            color: white;
        }

        .primary:hover {
            background: #0D6B64;
        }

        .secondary {
            background: #E5E7EB;
            color: #111827;
        }
        
        .secondary:hover {
            background: #D1D5DB;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #0F766E;
            margin-bottom: 15px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            animation: slideIn 0.3s ease;
            display: none;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #065F46; }
        .toast.error { background: #991B1B; }
        .toast.show { display: block; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            text-decoration: none;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #0F766E;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('supplier')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <a href="orders.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Order Details</h2>
    </header>

    <div class="container">
        <div id="detailsContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading order details...</p>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="inventory.html">
            <i class="fa-solid fa-boxes-stacked"></i>
            Inventory
        </a>
        <a href="orders.html" class="active">
            <i class="fa-solid fa-clipboard-list"></i>
            Orders
        </a>
        <a href="payments.html">
            <i class="fa-solid fa-wallet"></i>
            Escrow
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const detailsContainer = document.getElementById('detailsContainer');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Get Order ID from URL (?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        // Helper to format dates
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Show Toast
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Load Order Data
        async function loadOrderDetails() {
            if (!orderId) {
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">No Order ID provided.</p>`;
                return;
            }

            try {
                // FIX: Removed transporter_name, added logistics join
                const { data: order, error } = await supabase
                    .from('orders')
                    .select(`
                        id, order_number, status, total_amount, order_date, 
                        destination_address,
                        logistics:logistics_provider_id ( full_name, company_name ),
                        buyer:buyer_id ( full_name, company_name )
                    `)
                    .eq('id', orderId)
                    .maybeSingle();

                if (error) throw error;
                if (!order) {
                    detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Order not found.</p>`;
                    return;
                }

                renderOrder(order);

            } catch (error) {
                console.error('Error loading order details:', error);
                detailsContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading details. Please try again.</p>`;
            }
        }

        // Render HTML
        function renderOrder(order) {
            const buyerName = order.buyer?.company_name || order.buyer?.full_name || 'Unknown Buyer';
            const status = order.status || 'pending';
            const formattedDate = formatDate(order.order_date);

            // Dynamic Timeline based on status
            const steps = [
                { label: 'Order Placed', date: formattedDate, completed: true },
                { label: 'Escrow Funded', date: ['escrow_funded', 'shipped', 'delivered', 'completed'].includes(status) ? 'Funds Secured' : 'Pending', completed: ['escrow_funded', 'shipped', 'delivered', 'completed'].includes(status) },
                { label: 'Preparing Livestock', date: ['shipped', 'delivered', 'completed'].includes(status) ? 'Completed' : (status === 'escrow_funded' ? 'In Progress' : 'Pending'), completed: ['shipped', 'delivered', 'completed'].includes(status) },
                { label: 'Ready for Pickup / Shipped', date: ['delivered', 'completed'].includes(status) ? 'Shipped' : 'Next Step', completed: ['delivered', 'completed'].includes(status) },
                { label: 'Delivered', date: status === 'completed' ? 'Completed' : 'Pending', completed: status === 'completed' }
            ];

            const timelineHtml = steps.map(step => `
                <div class="step ${step.completed ? 'completed' : 'pending'}">
                    <strong>${step.label}</strong>
                    <small>${step.date}</small>
                </div>
            `).join('');

            // Action button logic
            const showMarkReady = status === 'escrow_funded';
            const showMarkShipped = status === 'confirmed' || status === 'escrow_funded'; // Assuming you mark it shipped/ready

            // FIX: Read transporter from order.logistics
            const transporterName = order.logistics?.company_name || order.logistics?.full_name || 'Unassigned';

            detailsContainer.innerHTML = `
                <div class="card">
                    <h3>Order Information</h3>
                    <div class="grid">
                        <div class="info">
                            <small>Order ID</small>
                            <strong>${order.order_number || 'N/A'}</strong>
                        </div>
                        <div class="info">
                            <small>Buyer</small>
                            <strong>${buyerName}</strong>
                        </div>
                        <div class="info">
                            <small>Destination</small>
                            <strong>${order.destination_address || 'N/A'}</strong>
                        </div>
                        <div class="info">
                            <small>Transporter</small>
                            <strong>${transporterName}</strong>
                        </div>
                        <div class="info">
                            <small>Total Amount</small>
                            <strong>$${Number(order.total_amount || 0).toLocaleString()}</strong>
                        </div>
                        <div class="info">
                            <small>Escrow Status</small>
                            <strong>${status === 'completed' ? 'Released' : 'Secured'}</strong>
                            <div class="status-badge ${status}">${status.replace('_', ' ')}</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>Order Timeline</h3>
                    <div class="timeline">
                        ${timelineHtml}
                    </div>
                </div>

                <div class="card">
                    <h3>Supplier Actions</h3>
                    <div class="actions">
                        <a href="upload-certificate.html?order_id=${order.id}" class="primary">
                            <i class="fa-solid fa-file-shield"></i><br><br>
                            Upload Vet Cert
                        </a>
                        <a href="payments.html" class="secondary">
                            <i class="fa-solid fa-wallet"></i><br><br>
                            View Escrow
                        </a>
                        
                        ${showMarkReady ? `
                            <button id="markReadyBtn" class="secondary" data-order-id="${order.id}">
                                <i class="fa-solid fa-truck"></i><br><br>
                                Mark Ready for Pickup
                            </button>
                        ` : ''}
                        
                        <a href="../logistics/tracking.html?order_id=${order.id}" class="primary">
                            <i class="fa-solid fa-route"></i><br><br>
                            View Logistics
                        </a>
                    </div>
                </div>
            `;

            // Attach event listener to the dynamic button
            const markReadyBtn = document.getElementById('markReadyBtn');
            if (markReadyBtn) {
                markReadyBtn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.dataset.orderId;
                    markReadyBtn.disabled = true;
                    markReadyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><br><br>Updating...';
                    
                    const { error } = await supabase
                        .from('orders')
                        .update({ status: 'shipped' })
                        .eq('id', id);
                        
                    if (error) {
                        showToast('Error updating order: ' + error.message, 'error');
                        markReadyBtn.disabled = false;
                        markReadyBtn.innerHTML = '<i class="fa-solid fa-truck"></i><br><br>Mark Ready for Pickup';
                    } else {
                        showToast('Order marked as ready for pickup!', 'success');
                        setTimeout(() => location.reload(), 1500);
                    }
                });
            }
        }

        // Initialize
        loadOrderDetails();
    </script>

</body>
</html>
