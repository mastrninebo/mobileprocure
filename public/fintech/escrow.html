<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrow Management | Mobile Procure</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #15803D;
            font-size: 20px;
            text-decoration: none;
        }

        header h2 {
            font-size: 22px;
            color: #15803D;
        }

        .hero {
            margin: 20px;
            padding: 25px;
            border-radius: 22px;
            background: linear-gradient(135deg, #15803D, #22C55E);
            color: white;
            box-shadow: 0 10px 25px rgba(21, 128, 61, 0.2);
        }

        .hero small { opacity: .9; font-size: 14px; }
        .hero h2 { font-size: 34px; margin: 10px 0; }
        .hero p { opacity: .95; font-size: 13px; }

        .container {
            padding: 0 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #fff;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,.05);
            transition: 0.3s;
        }

        .summary-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        .summary-card i {
            color: #15803D;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .summary-card h3 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .summary-card p {
            font-size: 13px;
            color: #6B7280;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1F2937;
        }

        .escrow-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,.05);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: 600;
            font-size: 16px;
            color: #1F2937;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge.funded { background: #DBEAFE; color: #1E40AF; }
        .badge.pending { background: #F3F4F6; color: #6B7280; }
        .badge.disputed { background: #FEE2E2; color: #DC2626; }
        .badge.released { background: #DCFCE7; color: #166534; }

        .amount {
            font-size: 28px;
            font-weight: 700;
            color: #15803D;
            margin: 12px 0;
        }

        .info {
            margin: 6px 0;
            font-size: 14px;
            color: #4B5563;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .actions button {
            border: none;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .actions button:hover { transform: translateY(-2px); }
        .actions button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-release { background: #15803D; color: white; }
        .btn-release:hover { background: #0D6B64; }

        .btn-hold { background: #F59E0B; color: white; }
        .btn-hold:hover { background: #D97706; }

        .btn-refund { background: #DC2626; color: white; }
        .btn-refund:hover { background: #B91C1C; }

        .btn-view { background: #E5E7EB; color: #1F2937; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-view:hover { background: #D1D5DB; }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #15803D;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
            background: white;
            border-radius: 18px;
        }

        .empty-state i {
            font-size: 50px;
            color: #15803D;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            animation: slideIn 0.3s ease;
            display: none;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #15803D; }
        .toast.error { background: #DC2626; }
        .toast.show { display: block; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 12px;
            gap: 5px;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #15803D;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('fintech')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <a href="dashboard.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Escrow Management</h2>
    </header>

    <div class="hero">
        <small>Escrow Overview</small>
        <h2 id="totalFunds">ZMW 0</h2>
        <p>Total funds currently managed in escrow</p>
    </div>

    <div class="container">
        
        <!-- Summary Cards -->
        <div class="summary">
            <div class="summary-card">
                <i class="fa-solid fa-vault"></i>
                <h3 id="fundsLocked">ZMW 0</h3>
                <p>Locked Funds</p>
            </div>
            <div class="summary-card">
                <i class="fa-solid fa-hourglass-half"></i>
                <h3 id="fundsPending">0</h3>
                <p>Pending Actions</p>
            </div>
            <div class="summary-card">
                <i class="fa-solid fa-scale-balanced"></i>
                <h3 id="fundsDisputed">ZMW 0</h3>
                <p>Disputed Funds</p>
            </div>
            <div class="summary-card">
                <i class="fa-solid fa-circle-check"></i>
                <h3 id="fundsReleased">ZMW 0</h3>
                <p>Released (All Time)</p>
            </div>
        </div>

        <h3 class="section-title">Active Escrow Accounts</h3>

        <div id="escrowContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading active accounts...</p>
            </div>
        </div>

    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="transactions.html">
            <i class="fa-solid fa-money-bill-transfer"></i>
            Transactions
        </a>
        <a href="escrow.html" class="active">
            <i class="fa-solid fa-vault"></i>
            Escrow
        </a>
        <a href="settlements.html">
            <i class="fa-solid fa-building-columns"></i>
            Settlements
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const escrowContainer = document.getElementById('escrowContainer');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Helper: Show Toast
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Helper: Format Currency
        function formatCurrency(amount) {
            return `ZMW ${Number(amount || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
        }

        // Load Escrow Data
        async function loadEscrowData() {
            try {
                const { data: escrows, error } = await supabase
                    .from('escrow_transactions')
                    .select(`
                        id, amount, status, created_at,
                        order:order_id (
                            id, order_number,
                            buyer:buyer_id ( full_name, company_name ),
                            supplier:supplier_id ( full_name, company_name )
                        )
                    `)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Calculate Stats
                let locked = 0, disputed = 0, released = 0, pendingCount = 0;
                
                escrows.forEach(e => {
                    const amt = parseFloat(e.amount || 0);
                    if (e.status === 'funded') locked += amt;
                    if (e.status === 'disputed') disputed += amt;
                    if (e.status === 'released') released += amt;
                    if (e.status === 'pending') pendingCount++;
                });

                document.getElementById('totalFunds').textContent = formatCurrency(locked + disputed);
                document.getElementById('fundsLocked').textContent = formatCurrency(locked);
                document.getElementById('fundsPending').textContent = pendingCount;
                document.getElementById('fundsDisputed').textContent = formatCurrency(disputed);
                document.getElementById('fundsReleased').textContent = formatCurrency(released);

                // Filter Active Accounts (funded, pending, disputed)
                const activeEscrows = escrows.filter(e => ['funded', 'pending', 'disputed'].includes(e.status));

                if (!activeEscrows || activeEscrows.length === 0) {
                    escrowContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-vault"></i>
                            <h3>No Active Escrows</h3>
                            <p>There are no funds currently locked or pending action.</p>
                        </div>
                    `;
                    return;
                }

                // Render Cards
                escrowContainer.innerHTML = activeEscrows.map(tx => {
                    const buyerName = tx.order?.buyer?.company_name || tx.order?.buyer?.full_name || 'Unknown Buyer';
                    const supplierName = tx.order?.supplier?.company_name || tx.order?.supplier?.full_name || 'Unknown Supplier';
                    const status = tx.status || 'pending';

                    return `
                        <div class="escrow-card">
                            <div class="top">
                                <span class="order-id">${tx.order?.order_number || 'N/A'}</span>
                                <span class="badge ${status}">${status}</span>
                            </div>
                            <div class="amount">${formatCurrency(tx.amount)}</div>
                            <p class="info"><strong>Buyer:</strong> ${buyerName}</p>
                            <p class="info"><strong>Supplier:</strong> ${supplierName}</p>
                            <p class="info"><strong>Escrow ID:</strong> ${tx.id}</p>
                            
                            <div class="actions">
                                <button class="btn-release" data-tx-id="${tx.id}" data-order-id="${tx.order?.id}" data-action="released">Release Funds</button>
                                <button class="btn-hold" data-tx-id="${tx.id}" data-order-id="${tx.order?.id}" data-action="disputed">Hold Funds</button>
                                <button class="btn-refund" data-tx-id="${tx.id}" data-order-id="${tx.order?.id}" data-action="refunded">Refund Buyer</button>
                                <a href="transactions.html" class="btn-view">View Ledger</a>
                            </div>
                        </div>
                    `;
                }).join('');

                // Attach Action Listeners
                document.querySelectorAll('.actions button').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const txId = e.currentTarget.dataset.txId;
                        const orderId = e.currentTarget.dataset.orderId;
                        const action = e.currentTarget.dataset.action; // released, disputed, refunded
                        
                        if (!confirm(`Are you sure you want to ${action === 'released' ? 'release funds to the supplier' : action === 'disputed' ? 'hold funds for review' : 'refund the buyer'}?`)) return;

                        btn.disabled = true;
                        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

                        try {
                            // 1. Update Escrow Transaction Status
                            const { error: txError } = await supabase
                                .from('escrow_transactions')
                                .update({ status: action })
                                .eq('id', txId);

                            if (txError) throw txError;

                            // 2. Update Order Status to reflect escrow action
                            let newOrderStatus = 'escrow_funded'; // default
                            if (action === 'released') newOrderStatus = 'completed';
                            if (action === 'disputed') newOrderStatus = 'disputed';
                            if (action === 'refunded') newOrderStatus = 'cancelled';

                            if (orderId) {
                                await supabase
                                    .from('orders')
                                    .update({ status: newOrderStatus })
                                    .eq('id', orderId);
                            }

                            showToast(`Funds successfully ${action}.`, 'success');
                            
                            // Reload data to update lists and stats
                            setTimeout(() => loadEscrowData(), 1000);

                        } catch (error) {
                            console.error('Error updating escrow:', error);
                            showToast('Error: ' + error.message, 'error');
                            btn.disabled = false;
                            btn.textContent = 'Retry';
                        }
                    });
                });

            } catch (error) {
                console.error('Error loading escrow data:', error);
                escrowContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading escrow data.</p>`;
            }
        }

        // Initialize
        loadEscrowData();
    </script>

</body>
</html>
