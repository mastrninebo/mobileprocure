<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlements | Mobile Procure</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile .avatar-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #15803D;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }

        .profile h3 {
            font-size: 20px;
        }

        .profile p {
            font-size: 13px;
            color: #6B7280;
        }

        .notify {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.05);
            cursor: pointer;
        }

        .hero {
            margin: 20px;
            padding: 25px;
            border-radius: 22px;
            background: linear-gradient(135deg, #15803D, #22C55E);
            color: white;
            box-shadow: 0 10px 25px rgba(21, 128, 61, 0.2);
        }

        .hero small { opacity: .9; font-size: 14px; }
        .hero h2 { font-size: 34px; margin: 10px 0; }
        .hero p { opacity: .95; font-size: 13px; }

        .container {
            padding: 0 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            padding: 16px 10px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,.05);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 18px;
            color: #15803D;
        }

        .card p {
            font-size: 11px;
            margin-top: 5px;
            color: #6B7280;
        }

        .search {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,.05);
        }

        .search i {
            margin-right: 10px;
            color: #6B7280;
        }

        .search input {
            border: none;
            outline: none;
            width: 100%;
            background: none;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
        }

        .settlement {
            background: #fff;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 18px rgba(0,0,0,.05);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order {
            font-weight: 600;
            font-size: 16px;
        }

        .badge {
            background: #DCFCE7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .amount {
            font-size: 28px;
            font-weight: 700;
            color: #15803D;
            margin: 15px 0;
        }

        .settlement p {
            margin: 6px 0;
            font-size: 14px;
            color: #4B5563;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .actions a {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .actions a:hover {
            transform: translateY(-2px);
        }

        .receipt {
            background: #15803D;
            color: white;
        }

        .receipt:hover { background: #0D6B64; }

        .details {
            background: #E5E7EB;
            color: #111827;
        }

        .details:hover { background: #D1D5DB; }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #15803D;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
            background: white;
            border-radius: 18px;
        }

        .empty-state i {
            font-size: 50px;
            color: #15803D;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 12px;
            gap: 5px;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #15803D;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('fintech')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <div class="profile">
            <div class="avatar-placeholder">F</div>
            <div>
                <h3>Settlements</h3>
                <p>Completed escrow releases</p>
            </div>
        </div>
        <div class="notify">
            <i class="fa-regular fa-bell"></i>
        </div>
    </header>

    <div class="hero">
        <small>Settlement Overview</small>
        <h2 id="totalSettled">ZMW 0</h2>
        <p>Total funds settled this quarter</p>
    </div>

    <div class="container">
        
        <div class="summary">
            <div class="card">
                <h3 id="statTotal">ZMW 0</h3>
                <p>Total Settled</p>
            </div>
            <div class="card">
                <h3 id="statCount">0</h3>
                <p>Transactions</p>
            </div>
            <div class="card">
                <h3 id="statRate">0%</h3>
                <p>Success Rate</p>
            </div>
        </div>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search Order ID, Buyer or Supplier...">
        </div>

        <div id="txContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading settlements...</p>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="transactions.html">
            <i class="fa-solid fa-money-bill-transfer"></i>
            Transactions
        </a>
        <a href="escrow.html">
            <i class="fa-solid fa-vault"></i>
            Escrow
        </a>
        <a href="settlements.html" class="active">
            <i class="fa-solid fa-building-columns"></i>
            Settlements
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const txContainer = document.getElementById('txContainer');
        const searchInput = document.getElementById('searchInput');
        
        let allSettlements = [];

        // Load Settlements
        async function loadSettlements() {
            try {
                // Fetch Released Transactions
                const { data: released, error: relError } = await supabase
                    .from('escrow_transactions')
                    .select(`
                        id, amount, status, created_at,
                        order:order_id (
                            order_number,
                            buyer:buyer_id ( full_name, company_name ),
                            supplier:supplier_id ( full_name, company_name )
                        )
                    `)
                    .eq('status', 'released')
                    .order('created_at', { ascending: false });

                if (relError) throw relError;

                // Fetch Disputed/Refunded to calculate Success Rate
                const { count: failedCount, error: failError } = await supabase
                    .from('escrow_transactions')
                    .select('*', { count: 'exact', head: true })
                    .in('status', ['disputed', 'refunded']);

                if (failError) throw failError;

                allSettlements = released || [];

                // Calculate Stats
                const totalAmount = allSettlements.reduce((sum, tx) => sum + parseFloat(tx.amount || 0), 0);
                const totalCount = allSettlements.length;
                const successRate = totalCount > 0 ? ((totalCount / (totalCount + (failedCount || 0))) * 100).toFixed(1) : 100;

                document.getElementById('totalSettled').textContent = `ZMW ${totalAmount.toLocaleString()}`;
                document.getElementById('statTotal').textContent = `ZMW ${totalAmount.toLocaleString()}`;
                document.getElementById('statCount').textContent = totalCount;
                document.getElementById('statRate').textContent = `${successRate}%`;

                renderSettlements(allSettlements);

            } catch (error) {
                console.error('Error loading settlements:', error);
                txContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading settlements.</p>`;
            }
        }

        // Render Cards
        function renderSettlements(items) {
            if (!items || items.length === 0) {
                txContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-receipt"></i>
                        <h3>No Settlements</h3>
                        <p>There are no completed settlements yet.</p>
                    </div>
                `;
                return;
            }

            txContainer.innerHTML = items.map(tx => {
                const buyerName = tx.order?.buyer?.company_name || tx.order?.buyer?.full_name || 'Unknown Buyer';
                const supplierName = tx.order?.supplier?.company_name || tx.order?.supplier?.full_name || 'Unknown Supplier';
                const date = new Date(tx.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                const refId = `STL-${tx.id.substring(0, 8).toUpperCase()}`;

                return `
                    <div class="settlement">
                        <div class="top">
                            <span class="order">${tx.order?.order_number || 'N/A'}</span>
                            <span class="badge">Completed</span>
                        </div>
                        <div class="amount">ZMW ${Number(tx.amount).toLocaleString()}</div>
                        <p><strong>Buyer:</strong> ${buyerName}</p>
                        <p><strong>Supplier:</strong> ${supplierName}</p>
                        <p><strong>Settlement Date:</strong> ${date}</p>
                        <p><strong>Reference:</strong> ${refId}</p>
                        <div class="actions">
                            <a href="#" class="receipt" onclick="alert('Generating Receipt PDF for ${refId}...'); return false;">Receipt</a>
                            <a href="transactions.html" class="details">Details</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search Listener
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allSettlements.filter(tx => {
                const orderNum = (tx.order?.order_number || '').toLowerCase();
                const buyer = (tx.order?.buyer?.company_name || tx.order?.buyer?.full_name || '').toLowerCase();
                const supplier = (tx.order?.supplier?.company_name || tx.order?.supplier?.full_name || '').toLowerCase();
                return orderNum.includes(query) || buyer.includes(query) || supplier.includes(query);
            });
            renderSettlements(filtered);
        });

        // Initialize
        loadSettlements();
    </script>

</body>
</html>
