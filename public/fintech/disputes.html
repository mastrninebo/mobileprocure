<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispute Resolution | Mobile Procure</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #15803D;
            font-size: 20px;
            text-decoration: none;
        }

        header h2 {
            font-size: 20px;
            color: #15803D;
        }

        .hero {
            margin: 20px;
            padding: 25px;
            border-radius: 22px;
            background: linear-gradient(135deg, #B91C1C, #EF4444);
            color: white;
            box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2);
        }

        .hero small { opacity: .9; font-size: 14px; }
        .hero h2 { font-size: 34px; margin: 10px 0; }
        .hero p { opacity: .95; font-size: 13px; }

        .container {
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,.05);
            transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        .stat-card h3 {
            font-size: 20px;
            color: #1F2937;
        }

        .stat-card p {
            font-size: 11px;
            color: #6B7280;
            margin-top: 5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filters button {
            border: none;
            background: #E5E7EB;
            padding: 10px 16px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .filters button:hover { background: #D1D5DB; }

        .filters button.active {
            background: #15803D;
            color: #fff;
        }

        .case-card {
            background: #fff;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 18px rgba(0,0,0,.05);
            border-left: 5px solid #DC2626;
        }

        .case-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .case-id {
            font-weight: 600;
            font-size: 15px;
        }

        .priority {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .high { background: #FEE2E2; color: #B91C1C; }
        .medium { background: #FEF3C7; color: #92400E; }
        .low { background: #DCFCE7; color: #166534; }

        .case-card p {
            margin: 6px 0;
            font-size: 14px;
            color: #4B5563;
        }

        .amount {
            font-size: 22px;
            font-weight: 700;
            color: #1F2937;
            margin: 12px 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background: #F3F4F6;
            color: #6B7280;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .actions button {
            border: none;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .actions button:hover { transform: translateY(-2px); }
        .actions button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-release { background: #15803D; color: white; }
        .btn-release:hover { background: #0D6B64; }

        .btn-refund { background: #DC2626; color: white; }
        .btn-refund:hover { background: #B91C1C; }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #15803D;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
            background: white;
            border-radius: 18px;
        }

        .empty-state i {
            font-size: 50px;
            color: #15803D;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            animation: slideIn 0.3s ease;
            display: none;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #15803D; }
        .toast.error { background: #DC2626; }
        .toast.show { display: block; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 12px;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #15803D;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('fintech')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <a href="dashboard.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Dispute Resolution</h2>
    </header>

    <div class="hero">
        <small>Dispute Overview</small>
        <h2 id="totalDisputes">0</h2>
        <p>Total active disputes requiring investigation</p>
    </div>

    <div class="container">
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="statOpen">0</h3>
                <p>Open Cases</p>
            </div>
            <div class="stat-card">
                <h3 id="statHigh">0</h3>
                <p>High Priority</p>
            </div>
            <div class="stat-card">
                <h3 id="statResolved">0</h3>
                <p>Resolved (All Time)</p>
            </div>
        </div>

        <div class="filters">
            <button class="active" data-filter="all">All Open</button>
            <button data-filter="high">High Priority</button>
            <button data-filter="medium">Medium Priority</button>
            <button data-filter="low">Low Priority</button>
        </div>

        <div id="disputeContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading active disputes...</p>
            </div>
        </div>

    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="transactions.html">
            <i class="fa-solid fa-money-bill-transfer"></i>
            Transactions
        </a>
        <a href="escrow.html">
            <i class="fa-solid fa-vault"></i>
            Escrow
        </a>
        <a href="settlements.html">
            <i class="fa-solid fa-building-columns"></i>
            Settlements
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const disputeContainer = document.getElementById('disputeContainer');
        const filterButtons = document.querySelectorAll('.filters button');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        let allDisputes = [];
        let currentFilter = 'all';

        // Helper: Show Toast
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Load Disputes
        async function loadDisputes() {
            try {
                // 1. Fetch Active Disputes
                const { data: active, error: activeError } = await supabase
                    .from('escrow_transactions')
                    .select(`
                        id, amount, status, created_at,
                        order:order_id (
                            id, order_number,
                            buyer:buyer_id ( full_name, company_name ),
                            supplier:supplier_id ( full_name, company_name )
                        )
                    `)
                    .eq('status', 'disputed')
                    .order('created_at', { ascending: false });

                if (activeError) throw activeError;

                allDisputes = active || [];

                // 2. Fetch Resolved Stats (released/refunded)
                const { count: resolvedCount, error: resError } = await supabase
                    .from('escrow_transactions')
                    .select('*', { count: 'exact', head: true })
                    .in('status', ['released', 'refunded']);

                if (resError) throw resError;

                // Calculate Stats
                const highPriority = allDisputes.filter(d => d.amount > 50000).length;
                document.getElementById('totalDisputes').textContent = allDisputes.length;
                document.getElementById('statOpen').textContent = allDisputes.length;
                document.getElementById('statHigh').textContent = highPriority;
                document.getElementById('statResolved').textContent = resolvedCount || 0;

                renderDisputes();

            } catch (error) {
                console.error('Error loading disputes:', error);
                disputeContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading disputes.</p>`;
            }
        }

        // Render Cards
        function renderDisputes() {
            let filtered = allDisputes;
            if (currentFilter !== 'all') {
                filtered = allDisputes.filter(d => {
                    if (currentFilter === 'high') return d.amount > 50000;
                    if (currentFilter === 'medium') return d.amount >= 10000 && d.amount <= 50000;
                    if (currentFilter === 'low') return d.amount < 10000;
                    return true;
                });
            }

            if (filtered.length === 0) {
                disputeContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-shield-halved"></i>
                        <h3>No Disputes Found</h3>
                        <p>There are no disputes matching this filter.</p>
                    </div>
                `;
                return;
            }

            disputeContainer.innerHTML = filtered.map(tx => {
                const buyerName = tx.order?.buyer?.company_name || tx.order?.buyer?.full_name || 'Unknown Buyer';
                const supplierName = tx.order?.supplier?.company_name || tx.order?.supplier?.full_name || 'Unknown Supplier';
                const date = new Date(tx.created_at).toLocaleDateString();
                const caseId = `CASE-${tx.id.substring(0, 8).toUpperCase()}`;
                
                // Dynamic Priority
                let priority = 'medium';
                if (tx.amount > 50000) priority = 'high';
                else if (tx.amount < 10000) priority = 'low';

                return `
                    <div class="case-card">
                        <div class="case-top">
                            <span class="case-id">${caseId}</span>
                            <span class="priority ${priority}">${priority} Priority</span>
                        </div>
                        <p><strong>Order:</strong> ${tx.order?.order_number || 'N/A'}</p>
                        <p><strong>Buyer:</strong> ${buyerName}</p>
                        <p><strong>Supplier:</strong> ${supplierName}</p>
                        <div class="amount">$${Number(tx.amount).toLocaleString()}</div>
                        <p><strong>Filed:</strong> ${date}</p>
                        <span class="status">Funds Locked - Awaiting Resolution</span>
                        
                        <div class="actions">
                            <button class="btn-release" data-tx-id="${tx.id}" data-order-id="${tx.order?.id}" data-action="released">
                                Release to Supplier
                            </button>
                            <button class="btn-refund" data-tx-id="${tx.id}" data-order-id="${tx.order?.id}" data-action="refunded">
                                Refund Buyer
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Attach Listeners
            document.querySelectorAll('.actions button').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const txId = e.currentTarget.dataset.txId;
                    const orderId = e.currentTarget.dataset.orderId;
                    const action = e.currentTarget.dataset.action; // released or refunded
                    
                    if (!confirm(`Are you sure you want to ${action === 'released' ? 'release funds to the supplier' : 'refund the buyer'}? This will close the dispute.`)) return;

                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

                    try {
                        // 1. Update Escrow Status
                        const { error: txError } = await supabase
                            .from('escrow_transactions')
                            .update({ status: action })
                            .eq('id', txId);

                        if (txError) throw txError;

                        // 2. Update Order Status
                        let newOrderStatus = action === 'released' ? 'completed' : 'cancelled';
                        if (orderId) {
                            await supabase
                                .from('orders')
                                .update({ status: newOrderStatus })
                                .eq('id', orderId);
                        }

                        showToast(`Dispute resolved. Funds ${action}.`, 'success');
                        
                        // Reload data to update lists and stats
                        setTimeout(() => loadDisputes(), 1000);

                    } catch (error) {
                        console.error('Error resolving dispute:', error);
                        showToast('Error: ' + error.message, 'error');
                        btn.disabled = false;
                        btn.textContent = 'Retry';
                    }
                });
            });
        }

        // Filter Listeners
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderDisputes();
            });
        });

        // Initialize
        loadDisputes();
    </script>

</body>
</html>
