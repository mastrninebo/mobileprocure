<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Procure | Deliveries</title>
    
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #1F2937;
            padding-bottom: 100px;
        }

        header {
            background: #fff;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            text-decoration: none;
            color: #0F766E;
            font-size: 20px;
        }

        header h2 {
            font-size: 22px;
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 20px;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filters button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filters button.active {
            background: #0F766E;
            color: #fff;
        }

        .container {
            padding: 0 20px;
        }

        .job {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,.05);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .job-id {
            font-weight: 600;
            color: #0F766E;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .assigned { background: #F3F4F6; color: #6B7280; }
        .in_transit { background: #DBEAFE; color: #1D4ED8; }
        .border { background: #FEF3C7; color: #92400E; }
        .delivered { background: #DCFCE7; color: #166534; }
        .failed { background: #FEE2E2; color: #991B1B; }

        .job h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .info {
            background: #F8FAFC;
            padding: 12px;
            border-radius: 12px;
        }

        .info small {
            display: block;
            color: #6B7280;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .info strong {
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .buttons a {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .view {
            background: #E5E7EB;
            color: #111827;
        }

        .view:hover { background: #D1D5DB; }

        .track {
            background: #0F766E;
            color: white;
        }

        .track:hover { background: #0D6B64; }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #0F766E;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .empty-state i {
            font-size: 50px;
            color: #0F766E;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 12px;
            color: #9CA3AF;
        }

        .bottom-nav a.active {
            color: #0F766E;
            font-weight: 600;
        }

        .bottom-nav i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) {
                    window.location.href = '/login.html';
                    return;
                }

                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error) throw error;

                const userRoles = roles ? roles.map(r => r.role) : [];

                if (!userRoles.includes('logistics')) {
                    window.location.href = '/unauthorized.html';
                    return;
                }

                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        await protectPage();
    </script>

    <header>
        <a href="dashboard.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Deliveries</h2>
    </header>

    <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="assigned">Pickup</button>
        <button data-filter="in_transit">In Transit</button>
        <button data-filter="border">Border</button>
        <button data-filter="delivered">Completed</button>
    </div>

    <div class="container">
        <div id="deliveriesContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading deliveries...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
        <a href="deliveries.html" class="active">
            <i class="fa-solid fa-truck-fast"></i>
            Deliveries
        </a>
        <a href="tracking.html">
            <i class="fa-solid fa-location-dot"></i>
            Tracking
        </a>
        <a href="qr-scan.html">
            <i class="fa-solid fa-qrcode"></i>
            QR Scan
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const deliveriesContainer = document.getElementById('deliveriesContainer');
        const filterButtons = document.querySelectorAll('.filters button');
        
        let allDeliveries = [];
        let currentFilter = 'all';

        // Load deliveries from database
        async function loadDeliveries() {
            try {
                const user = await getCurrentUser();
                if (!user) return;

                const { data, error } = await supabase
                    .from('deliveries')
                    .select(`
                        id,
                        tracking_number,
                        status,
                        current_location,
                        estimated_delivery,
                        order:order_id (
                            order_number,
                            total_amount,
                            supplier:supplier_id ( full_name, company_name ),
                            buyer:buyer_id ( full_name, company_name )
                        )
                    `)
                    .eq('logistics_provider_id', user.id)
                    .order('estimated_delivery', { ascending: false });

                if (error) throw error;

                allDeliveries = data || [];
                renderDeliveries();

            } catch (error) {
                console.error('Error loading deliveries:', error);
                deliveriesContainer.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading deliveries. Please try again.</p>`;
            }
        }

        // Render delivery cards
        function renderDeliveries() {
            // Filter deliveries based on selected tab
            let filteredDeliveries = allDeliveries;
            if (currentFilter !== 'all') {
                filteredDeliveries = allDeliveries.filter(d => d.status === currentFilter);
            }

            if (!filteredDeliveries || filteredDeliveries.length === 0) {
                deliveriesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-truck-fast"></i>
                        <h3>No Deliveries Found</h3>
                        <p>There are no deliveries matching this filter right now.</p>
                    </div>
                `;
                return;
            }

            deliveriesContainer.innerHTML = filteredDeliveries.map(delivery => {
                const orderNumber = delivery.order?.order_number || 'N/A';
                const supplierName = delivery.order?.supplier?.company_name || delivery.order?.supplier?.full_name || 'Unknown Supplier';
                const buyerName = delivery.order?.buyer?.company_name || delivery.order?.buyer?.full_name || 'Unknown Buyer';
                const status = delivery.status || 'pending';
                const currentLocation = delivery.current_location || 'N/A';
                const eta = delivery.estimated_delivery ? new Date(delivery.estimated_delivery).toLocaleDateString() : 'N/A';
                
                let actionBtnText = 'Manage';
                let actionBtnHref = `delivery-details.html?id=${delivery.id}`;
                
                if (status === 'in_transit' || status === 'border') {
                    actionBtnText = 'Track';
                    actionBtnHref = `tracking.html?id=${delivery.id}`;
                } else if (status === 'delivered') {
                    actionBtnText = 'Receipt';
                }

                return `
                    <div class="job">
                        <div class="top">
                            <div class="job-id">
                                ${delivery.tracking_number || 'N/A'}
                            </div>
                            <div class="status ${status}">
                                ${status.replace('_', ' ')}
                            </div>
                        </div>
                        <h3>Order: ${orderNumber}</h3>
                        <div class="grid">
                            <div class="info">
                                <small>Supplier</small>
                                <strong>${supplierName}</strong>
                            </div>
                            <div class="info">
                                <small>Buyer</small>
                                <strong>${buyerName}</strong>
                            </div>
                            <div class="info">
                                <small>Current Location</small>
                                <strong>${currentLocation}</strong>
                            </div>
                            <div class="info">
                                <small>ETA</small>
                                <strong>${eta}</strong>
                            </div>
                        </div>
                        <div class="buttons">
                            <a href="delivery-details.html?id=${delivery.id}" class="view">Details</a>
                            <a href="${actionBtnHref}" class="track">${actionBtnText}</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter button event listeners
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderDeliveries();
            });
        });

        // Initialize
        loadDeliveries();
    </script>

</body>
</html>
