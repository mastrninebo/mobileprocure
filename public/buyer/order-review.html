<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Review | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F5F7FA; color: #1F2937; padding-bottom: 120px; }
        
        header {
            background: white; padding: 20px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,.05); position: sticky; top: 0; z-index: 100;
        }
        header a { color: #0F766E; font-size: 20px; text-decoration: none; }
        header h2 { font-size: 22px; color: #0F766E; }

        .container { padding: 20px; }

        .card {
            background: #fff; border-radius: 18px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,.05);
        }

        .product { display: flex; gap: 15px; align-items: center; }
        .product img {
            width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: #ECECEC;
        }
        .product h3 { margin-bottom: 5px; font-size: 16px; text-transform: capitalize; }
        .product p { color: #6B7280; font-size: 13px; }
        .product .badge {
            display: inline-block; margin-top: 8px; background: #DCFCE7; color: #166534;
            padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
        }

        .section-title { margin-bottom: 18px; font-size: 16px; color: #0F766E; border-bottom: 1px solid #ECECEC; padding-bottom: 8px; }

        .summary-row {
            display: flex; justify-content: space-between; padding: 12px 0;
            border-bottom: 1px solid #F1F5F9; font-size: 14px;
        }
        .summary-row:last-child { border-bottom: none; }
        .label { color: #6B7280; }
        .value { font-weight: 600; text-align: right; }

        .total { font-size: 20px; font-weight: 700; color: #0F766E; padding-top: 15px; }

        .trust-box {
            background: #ECFDF5; border-left: 5px solid #10B981; padding: 18px; border-radius: 12px;
        }
        .trust-box h4 { margin-bottom: 12px; color: #065F46; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .trust-box p { margin-bottom: 8px; font-size: 13px; color: #047857; display: flex; align-items: center; gap: 8px; }

        .checkbox-group { display: flex; flex-direction: column; gap: 15px; }
        .checkbox { display: flex; align-items: flex-start; gap: 12px; }
        .checkbox input { margin-top: 4px; transform: scale(1.2); accent-color: #0F766E; }
        .checkbox label { font-size: 14px; line-height: 1.5; color: #374151; }

        .footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #fff;
            padding: 18px; box-shadow: 0 -5px 20px rgba(0,0,0,.08); z-index: 100;
        }
        .btn {
            display: block; width: 100%; text-align: center; padding: 16px; background: #0F766E;
            color: white; text-decoration: none; border-radius: 14px; font-size: 16px; font-weight: 600;
            transition: 0.3s; border: none; cursor: pointer;
        }
        .btn:hover { background: #0D6B64; }
        .btn:disabled { background: #9CA3AF; cursor: not-allowed; }

        .loading-spinner { text-align: center; padding: 60px 20px; color: #6B7280; }
        .loading-spinner i { font-size: 40px; color: #0F766E; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('buyer')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <header>
        <a href="javascript:history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Order Review</h2>
    </header>

    <div class="container">
        <div id="reviewContent">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading order details...</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="proceedBtn" class="btn" disabled>
            <i class="fa-solid fa-lock"></i> Proceed to Escrow Payment
        </button>
    </div>

    <script type="module">
        import { supabase } from '../assets/js/supabase-client.js';

        const reviewContent = document.getElementById('reviewContent');
        const proceedBtn = document.getElementById('proceedBtn');

        // Get details from URL
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('item');
        const qty = parseInt(urlParams.get('qty')) || 1;
        const dest = urlParams.get('dest') || 'N/A';

        let currentItem = null;

        async function loadReview() {
            if (!itemId) {
                reviewContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Missing order information.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select('*, supplier:supplier_id(company_name, full_name, is_verified)')
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    reviewContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Listing not found.</p>`;
                    return;
                }

                currentItem = data;
                renderReview(data);
            } catch (error) {
                console.error('Error:', error);
                reviewContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading data.</p>`;
            }
        }

        function renderReview(item) {
            const imageSrc = (item.images && item.images.length > 0) ? item.images[0] : null;
            const supplierName = item.supplier?.company_name || item.supplier?.full_name || 'Unknown Supplier';
            
            const subtotal = qty * parseFloat(item.price_per_unit);
            const fee = subtotal * 0.025;
            const total = subtotal + fee;

            reviewContent.innerHTML = `
                <div class="card">
                    <div class="product">
                        ${imageSrc ? `<img src="${imageSrc}" alt="${item.breed}">` : `<div style="width:80px;height:80px;background:#ECECEC;border-radius:12px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-cow" style="font-size:30px;color:#D1D5DB;"></i></div>`}
                        <div>
                            <h3>${item.breed || 'Unknown Breed'}</h3>
                            <p>From: ${supplierName}</p>
                            ${item.supplier?.is_verified ? `<span class="badge">Verified Supplier</span>` : ''}
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">Order Details</h3>
                    <div class="summary-row">
                        <span class="label">Category</span>
                        <span class="value" style="text-transform:capitalize;">${item.category || 'N/A'}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Quantity</span>
                        <span class="value">${qty} ${item.unit || 'Head'}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Destination</span>
                        <span class="value">${dest}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Escrow Service</span>
                        <span class="value" style="color:#16A34A;">Enabled</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">Payment Summary</h3>
                    <div class="summary-row">
                        <span class="label">Livestock Cost (${qty} x ZMW ${Number(item.price_per_unit).toLocaleString()})</span>
                        <span class="value">ZMW ${subtotal.toLocaleString()}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Platform Fee (2.5%)</span>
                        <span class="value">ZMW ${fee.toLocaleString()}</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total to Escrow</span>
                        <span>ZMW ${total.toLocaleString()}</span>
                    </div>
                </div>

                <div class="card">
                    <div class="trust-box">
                        <h4><i class="fa-solid fa-shield-halved"></i> Escrow Protection</h4>
                        <p><i class="fa-solid fa-check"></i> Funds remain securely held until delivery is confirmed.</p>
                        <p><i class="fa-solid fa-check"></i> Payment is released only after successful inspection.</p>
                        <p><i class="fa-solid fa-check"></i> All transactions are digitally recorded for auditing.</p>
                    </div>
                </div>

                <div class="card">
                    <div class="checkbox-group">
                        <div class="checkbox">
                            <input type="checkbox" id="termsCheck1">
                            <label for="termsCheck1">I have reviewed the livestock details and confirm that this order is correct.</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="termsCheck2">
                            <label for="termsCheck2">I agree to the Mobile Procure escrow terms and conditions.</label>
                        </div>
                    </div>
                </div>
            `;

            // Enable button only if both checkboxes are checked
            const check1 = document.getElementById('termsCheck1');
            const check2 = document.getElementById('termsCheck2');
            
            const checkListener = () => {
                proceedBtn.disabled = !(check1.checked && check2.checked);
            };
            
            check1.addEventListener('change', checkListener);
            check2.addEventListener('change', checkListener);
        }

        // Handle Proceed Button
        proceedBtn.addEventListener('click', () => {
            if (proceedBtn.disabled || !currentItem) return;
            
            // Redirect to escrow-payment.html with all params
            window.location.href = `escrow-payment.html?item=${itemId}&qty=${qty}&dest=${encodeURIComponent(dest)}`;
        });

        loadReview();
    </script>
</body>
</html>
