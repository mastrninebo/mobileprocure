<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F5F7FA; color: #1F2937; padding-bottom: 100px; }
        
        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #0F766E; font-size: 20px; text-decoration: none; }
        header h2 { font-size: 20px; color: #0F766E; }

        .container { padding: 20px; }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .item-summary {
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #ECECEC;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .item-summary img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #ECECEC;
        }
        .item-summary h3 { font-size: 16px; margin-bottom: 4px; text-transform: capitalize; }
        .item-summary p { font-size: 13px; color: #6B7280; }
        .item-summary .price-per { font-size: 14px; color: #0F766E; font-weight: 600; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151; }
        
        .quantity-wrapper {
            display: flex;
            align-items: center;
            background: #F8FAFC;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
        }
        .qty-btn {
            background: none;
            border: none;
            width: 50px;
            height: 50px;
            font-size: 18px;
            cursor: pointer;
            color: #0F766E;
            transition: 0.2s;
        }
        .qty-btn:hover { background: #ECECEC; }
        .qty-input {
            flex: 1;
            text-align: center;
            border: none;
            background: none;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            background: #F8FAFC;
        }
        input[type="text"]:focus, textarea:focus { border-color: #0F766E; background: white; }

        .total-card {
            background: #0F766E;
            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            opacity: 0.9;
        }
        .grand-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.2);
            margin-top: 15px;
            padding-top: 15px;
            font-size: 20px;
            font-weight: 700;
        }

        .btn-submit {
            display: block;
            text-align: center;
            padding: 16px;
            background: #0F766E;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn-submit:hover { background: #0D6B64; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .loading-spinner { text-align: center; padding: 60px 20px; color: #6B7280; }
        .loading-spinner i { font-size: 40px; color: #0F766E; margin-bottom: 15px; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 24px;
            border-radius: 12px; color: white; font-weight: 500; font-size: 14px;
            z-index: 3000; animation: slideIn 0.3s ease; display: none; max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #0F766E; }
        .toast.error { background: #DC2626; }
        .toast.show { display: block; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; display: flex; justify-content: space-around;
            padding: 15px 0; box-shadow: 0 -5px 20px rgba(0,0,0,.08); z-index: 1000;
        }
        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; font-size: 12px; gap: 5px; color: #9CA3AF;
        }
        .bottom-nav a.active { color: #0F766E; font-weight: 600; }
        .bottom-nav i { font-size: 20px; }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('buyer')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <header>
        <a href="javascript:history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Place Order</h2>
    </header>

    <div class="container">
        <div id="contentArea">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading order form...</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><span id="toastMessage"></span></div>

    <div class="bottom-nav">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="marketplace.html" class="active"><i class="fa-solid fa-store"></i> Marketplace</a>
        <a href="orders.html"><i class="fa-solid fa-box"></i> Orders</a>
        <a href="catalog.html"><i class="fa-solid fa-book"></i> Catalog</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </div>

    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const contentArea = document.getElementById('contentArea');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('item');

        let currentItem = null;
        let currentQuantity = 1;

        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        async function loadItem() {
            if (!itemId) {
                contentArea.innerHTML = `<p style="color:#DC2626;text-align:center;">No item specified.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select('*, supplier:supplier_id(id, full_name, company_name)')
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    contentArea.innerHTML = `<p style="color:#DC2626;text-align:center;">Listing not found.</p>`;
                    return;
                }

                currentItem = data;
                renderForm(data);
            } catch (error) {
                console.error('Error loading item:', error);
                contentArea.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading data.</p>`;
            }
        }

        function renderForm(item) {
            const imageSrc = (item.images && item.images.length > 0) ? item.images[0] : '../assets/images/cattle.jpg';
            const maxQty = item.quantity || 1;

            contentArea.innerHTML = `
                <div class="card">
                    <div class="item-summary">
                        <img src="${imageSrc}" alt="${item.breed}">
                        <div>
                            <h3>${item.breed || 'Unknown Breed'}</h3>
                            <p>From: ${item.supplier?.company_name || item.supplier?.full_name || 'Unknown Supplier'}</p>
                            <div class="price-per">$${Number(item.price_per_unit).toLocaleString()} / ${item.unit || 'head'}</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Quantity (Max: ${maxQty})</label>
                        <div class="quantity-wrapper">
                            <button type="button" class="qty-btn" onclick="updateQty(-1, ${maxQty})">-</button>
                            <input type="number" id="qtyInput" class="qty-input" value="1" min="1" max="${maxQty}" onchange="calculateTotal()">
                            <button type="button" class="qty-btn" onclick="updateQty(1, ${maxQty})">+</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Delivery Destination</label>
                        <input type="text" id="destinationInput" placeholder="e.g. Lusaka, Zambia" value="Lusaka, Zambia">
                    </div>
                </div>

                <div class="total-card">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotal">$0</span>
                    </div>
                    <div class="total-row">
                        <span>Platform Fee (2.5%)</span>
                        <span id="fee">$0</span>
                    </div>
                    <div class="grand-total">
                        <span>Total to Escrow</span>
                        <span id="grandTotal">$0</span>
                    </div>
                </div>

                <button class="btn-submit" id="submitOrderBtn" onclick="submitOrder()">
                    <i class="fa-solid fa-lock"></i> Confirm & Secure Funds
                </button>
            `;

            calculateTotal();
        }

        window.updateQty = (change, max) => {
            let input = document.getElementById('qtyInput');
            let newVal = parseInt(input.value) + change;
            if (newVal < 1) newVal = 1;
            if (newVal > max) newVal = max;
            input.value = newVal;
            calculateTotal();
        };

        window.calculateTotal = () => {
            if (!currentItem) return;
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            currentQuantity = qty;
            
            const subtotal = qty * parseFloat(currentItem.price_per_unit);
            const fee = subtotal * 0.025;
            const total = subtotal + fee;

            document.getElementById('subtotal').textContent = `$${subtotal.toLocaleString()}`;
            document.getElementById('fee').textContent = `$${fee.toLocaleString()}`;
            document.getElementById('grandTotal').textContent = `$${total.toLocaleString()}`;
        };

        window.submitOrder = async () => {
            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Securing Funds...';

            try {
                const user = await getCurrentUser();
                if (!user) throw new Error("Session expired");

                const destination = document.getElementById('destinationInput').value.trim() || 'N/A';
                const subtotal = currentQuantity * parseFloat(currentItem.price_per_unit);
                const fee = subtotal * 0.025;
                const totalAmount = subtotal + fee;

                // Generate Order Number
                const orderNumber = `MP-${new Date().getFullYear()}-${Math.floor(100000 + Math.random() * 900000)}`;

                // 1. Create Order
                const { data: orderData, error: orderError } = await supabase
                    .from('orders')
                    .insert([{
                        order_number: orderNumber,
                        buyer_id: user.id,
                        supplier_id: currentItem.supplier_id,
                        total_amount: totalAmount,
                        destination_address: destination,
                        delivery_address: destination, // <-- Added this to satisfy the NOT NULL constraint
                        status: 'pending' // Starts as pending
                    }])
                    .select();

                if (orderError) throw orderError;
                const newOrderId = orderData[0].id;

                // 2. Create Escrow Transaction
                const { error: escError } = await supabase
                    .from('escrow_transactions')
                    .insert([{
                        order_id: newOrderId,
                        buyer_id: user.id,
                        supplier_id: currentItem.supplier_id,
                        amount: totalAmount,
                        status: 'pending' // Pending until supplier accepts
                    }]);

                if (escError) throw escError;

                // 3. (Optional) Decrement available inventory
                const newQty = (currentItem.quantity - currentQuantity);
                await supabase
                    .from('inventory_items')
                    .update({ quantity: Math.max(0, newQty) })
                    .eq('id', currentItem.id);

                showToast('Order placed successfully! Escrow initiated.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'payment-success.html';
                }, 1500);

            } catch (error) {
                console.error('Order submission error:', error);
                showToast('Error placing order: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> Confirm & Secure Funds';
            }
        };

        loadItem();
    </script>
</body>
</html>
