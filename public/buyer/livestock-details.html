<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Details | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #F5F7FA;
            padding-bottom: 90px;
            color: #1F2937;
        }

        .header {
            position: relative;
        }

        .header img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #ECECEC;
        }

        .back {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #111;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        .content {
            margin-top: -30px;
            background: #fff;
            border-radius: 30px 30px 0 0;
            padding: 25px;
            position: relative;
            z-index: 10;
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .title h2 {
            color: #0F766E;
            font-size: 22px;
            text-transform: capitalize;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            color: #0F766E;
        }

        .location {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.verified { background: #DCFCE7; color: #166534; }
        .badge.pending { background: #FEF3C7; color: #92400E; }
        .badge.info { background: #DBEAFE; color: #1E40AF; }

        .section {
            margin-top: 25px;
        }

        .section h3 {
            margin-bottom: 12px;
            color: #0F766E;
            font-size: 16px;
            border-bottom: 1px solid #ECECEC;
            padding-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info {
            background: #F8FAFC;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
        }

        .info h4 {
            margin-bottom: 6px;
            font-size: 13px;
            color: #6B7280;
        }

        .info p {
            font-size: 16px;
            font-weight: 600;
            color: #1F2937;
            text-transform: capitalize;
        }

        .supplier {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #F8FAFC;
            padding: 18px;
            border-radius: 18px;
        }

        .supplier .avatar-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #0F766E;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }

        .supplier h4 {
            margin-bottom: 2px;
            font-size: 15px;
        }

        .supplier p {
            color: #6B7280;
            font-size: 13px;
        }

        .description {
            line-height: 1.7;
            color: #4B5563;
            font-size: 14px;
        }

        .actions {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 18px;
            display: flex;
            gap: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,.08);
            z-index: 100;
        }

        .actions button, .actions a {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }

        .secondary {
            background: #E5E7EB;
            color: #111827;
        }
        .secondary:hover { background: #D1D5DB; }

        .primary {
            background: #0F766E;
            color: #fff;
        }
        .primary:hover { background: #0D6B64; }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
            background: white;
            min-height: 100vh;
        }
        .loading-spinner i {
            font-size: 40px;
            color: #0F766E;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION SCRIPT -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('buyer')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <div id="mainContent" style="display:none;">
        <div class="header">
            <img id="listingImage" src="../assets/images/cattle.jpg" alt="Livestock">
            <a href="marketplace.html" class="back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <div class="content">
            <div class="title">
                <h2 id="breed">Loading...</h2>
                <div class="price" id="price">$0</div>
            </div>
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span id="location">Zambia</span>
            </div>

            <div class="badges" id="badgesContainer">
                <!-- Populated by JS -->
            </div>

            <div class="section">
                <h3>Livestock Information</h3>
                <div class="info-grid">
                    <div class="info">
                        <h4>Category</h4>
                        <p id="category">-</p>
                    </div>
                    <div class="info">
                        <h4>Available</h4>
                        <p id="quantity">-</p>
                    </div>
                    <div class="info">
                        <h4>Average Weight</h4>
                        <p id="weight">-</p>
                    </div>
                    <div class="info">
                        <h4>Health Status</h4>
                        <p id="health">-</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Supplier</h3>
                <div class="supplier">
                    <div class="avatar-placeholder" id="supplierAvatar">S</div>
                    <div>
                        <h4 id="supplierName">Supplier</h4>
                        <p>Verified Seller • Secure Escrow</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Description</h3>
                <p class="description" id="description">No description provided.</p>
            </div>
        </div>

        <div class="actions">
            <button class="secondary">Message Supplier</button>
            <a href="#" id="placeOrderBtn" class="primary">Place Order</a>
        </div>
    </div>

    <div id="loadingScreen" class="loading-spinner">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading listing details...</p>
    </div>

    <script type="module">
        import { supabase } from '../assets/js/supabase-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        async function loadListing() {
            if (!itemId) {
                document.getElementById('loadingScreen').innerHTML = `<p style="color:#DC2626;">No Item ID provided in URL.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select(`
                        *,
                        supplier:supplier_id (full_name, company_name, is_verified)
                    `)
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    document.getElementById('loadingScreen').innerHTML = `<p style="color:#DC2626;">Listing not found.</p>`;
                    return;
                }

                renderListing(data);
            } catch (error) {
                console.error('Error fetching listing:', error);
                document.getElementById('loadingScreen').innerHTML = `<p style="color:#DC2626;">Error loading data.</p>`;
            }
        }

        function renderListing(item) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // Image
            if (item.images && item.images.length > 0) {
                document.getElementById('listingImage').src = item.images[0];
            }

            // Text
            document.getElementById('breed').textContent = item.breed || 'Unknown Breed';
            document.getElementById('price').textContent = `$${Number(item.price_per_unit || 0).toLocaleString()} / ${item.unit || 'head'}`;
            document.getElementById('location').textContent = item.location_name || 'Location not specified';
            document.getElementById('category').textContent = item.category || 'N/A';
            document.getElementById('quantity').textContent = `${item.quantity || 0} ${item.unit || 'Head'}`;
            document.getElementById('weight').textContent = item.weight_kg ? `${item.weight_kg} kg` : 'N/A';
            document.getElementById('health').textContent = item.certification_status || 'Pending Inspection';
            document.getElementById('description').textContent = item.description || 'No description provided for this listing.';

            // Supplier
            const supplier = item.supplier;
            if (supplier) {
                const supplierName = supplier.company_name || supplier.full_name || 'Unknown Supplier';
                document.getElementById('supplierName').textContent = supplierName;
                document.getElementById('supplierAvatar').textContent = supplierName.charAt(0).toUpperCase();
            }

            // Badges
            const badgesHtml = [];
            if (item.certification_status === 'Fully Vaccinated') {
                badgesHtml.push('<div class="badge verified"><i class="fa-solid fa-check"></i> Vet Certified</div>');
            } else {
                badgesHtml.push('<div class="badge pending"><i class="fa-solid fa-clock"></i> Inspection Pending</div>');
            }
            badgesHtml.push('<div class="badge info"><i class="fa-solid fa-shield-halved"></i> Escrow Protected</div>');
            if (supplier && supplier.is_verified) {
                badgesHtml.push('<div class="badge verified"><i class="fa-solid fa-circle-check"></i> Verified Supplier</div>');
            }
            document.getElementById('badgesContainer').innerHTML = badgesHtml.join('');

            // Action Button
            document.getElementById('placeOrderBtn').href = `place-order.html?item=${item.id}`;
        }

        loadListing();
    </script>
</body>
</html>
