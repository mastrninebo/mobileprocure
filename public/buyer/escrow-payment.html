<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrow Payment | Mobile Procure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F5F7FA; color: #1F2937; padding-bottom: 100px; }
        
        header {
            background: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #0F766E; font-size: 20px; text-decoration: none; }
        header h2 { font-size: 20px; color: #0F766E; }

        .container { padding: 20px; }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,.05);
            margin-bottom: 20px;
        }

        .trust-banner {
            text-align: center;
            margin-bottom: 20px;
        }
        .trust-banner i {
            font-size: 40px;
            color: #0F766E;
            margin-bottom: 10px;
        }
        .trust-banner h3 {
            color: #1F2937;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .trust-banner p {
            color: #6B7280;
            font-size: 13px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            color: #6B7280;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #F1F5F9;
            font-size: 14px;
        }
        .summary-row:last-child { border-bottom: none; }
        .label { color: #6B7280; }
        .value { font-weight: 600; text-align: right; }

        .total-card {
            background: #0F766E;
            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .grand-total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 700;
        }

        .payment-methods { display: flex; flex-direction: column; gap: 10px; }
        .method {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .method:hover { border-color: #0F766E; background: #F8FAFC; }
        .method.selected { border-color: #0F766E; background: #F0FDFA; }
        .method i { font-size: 20px; color: #0F766E; width: 24px; text-align: center; }
        .method h4 { font-size: 14px; margin-bottom: 2px; }
        .method p { font-size: 12px; color: #6B7280; }
        .method .check { margin-left: auto; color: #0F766E; display: none; }
        .method.selected .check { display: block; }

        .btn-pay {
            display: block;
            text-align: center;
            padding: 16px;
            background: #0F766E;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            border-radius: 0;
            padding: 20px;
        }
        .btn-pay:hover { background: #0D6B64; }
        .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; }

        .loading-spinner { text-align: center; padding: 60px 20px; color: #6B7280; }
        .loading-spinner i { font-size: 40px; color: #0F766E; margin-bottom: 15px; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 24px;
            border-radius: 12px; color: white; font-weight: 500; font-size: 14px;
            z-index: 3000; animation: slideIn 0.3s ease; display: none; max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .toast.success { background: #0F766E; }
        .toast.error { background: #DC2626; }
        .toast.show { display: block; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- SESSION PROTECTION -->
    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';
        async function protectPage() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.profile) return window.location.href = '/login.html';
                const { data: roles, error } = await supabase.rpc('get_user_roles', { uid: user.id });
                if (error || !roles.map(r => r.role).includes('buyer')) return window.location.href = '/unauthorized.html';
                window.currentUser = user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        await protectPage();
    </script>

    <header>
        <a href="javascript:history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Escrow Payment</h2>
    </header>

    <div class="container">
        <div id="paymentContent">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading payment details...</p>
            </div>
        </div>
    </div>

    <button class="btn-pay" id="payBtn" disabled onclick="processPayment()" style="display:none;">
        <i class="fa-solid fa-lock"></i> Confirm & Pay
    </button>

    <!-- Toast -->
    <div class="toast" id="toast"><span id="toastMessage"></span></div>

    <script type="module">
        import { supabase, getCurrentUser } from '../assets/js/supabase-client.js';

        const paymentContent = document.getElementById('paymentContent');
        const payBtn = document.getElementById('payBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('item');
        const qty = parseInt(urlParams.get('qty')) || 1;
        const dest = urlParams.get('dest') || 'N/A';

        let currentItem = null;
        let totalAmount = 0;

        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        async function loadPaymentDetails() {
            if (!itemId) {
                paymentContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Missing order information.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('inventory_items')
                    .select('*, supplier:supplier_id(company_name, full_name)')
                    .eq('id', itemId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    paymentContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Listing not found.</p>`;
                    return;
                }

                currentItem = data;
                renderPaymentScreen(data);
            } catch (error) {
                console.error('Error:', error);
                paymentContent.innerHTML = `<p style="color:#DC2626;text-align:center;">Error loading data.</p>`;
            }
        }

        function renderPaymentScreen(item) {
            const subtotal = qty * parseFloat(item.price_per_unit);
            const fee = subtotal * 0.025;
            totalAmount = subtotal + fee;

            paymentContent.innerHTML = `
                <div class="card">
                    <div class="trust-banner">
                        <i class="fa-solid fa-shield-halved"></i>
                        <h3>Secured by Mobile Procure Escrow</h3>
                        <p>Your funds will be held securely and only released to the supplier once you confirm delivery.</p>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">Order Summary</h3>
                    <div class="summary-row">
                        <span class="label">Item</span>
                        <span class="value" style="text-transform:capitalize;">${item.breed || 'Unknown'}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Supplier</span>
                        <span class="value">${item.supplier?.company_name || item.supplier?.full_name || 'N/A'}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Quantity</span>
                        <span class="value">${qty} ${item.unit || 'Head'}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Destination</span>
                        <span class="value">${dest}</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">Payment Details</h3>
                    <div class="summary-row">
                        <span class="label">Subtotal</span>
                        <span class="value">ZMW ${subtotal.toLocaleString()}</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Platform Fee (2.5%)</span>
                        <span class="value">ZMW ${fee.toLocaleString()}</span>
                    </div>
                    <div class="total-card" style="margin-top: 15px;">
                        <div class="grand-total">
                            <span>Total to Pay</span>
                            <span>ZMW ${totalAmount.toLocaleString()}</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">Select Payment Method</h3>
                    <div class="payment-methods">
                        <div class="method selected" onclick="selectMethod(this)">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                            <div>
                                <h4>MTN Mobile Money</h4>
                                <p>Pay instantly via USSD or App</p>
                            </div>
                            <i class="fa-solid fa-circle-check check"></i>
                        </div>
                        <div class="method" onclick="selectMethod(this)">
                            <i class="fa-solid fa-building-columns"></i>
                            <div>
                                <h4>Bank Transfer</h4>
                                <p>ZICB, Stanbic, FNB</p>
                            </div>
                            <i class="fa-solid fa-circle-check check"></i>
                        </div>
                        <div class="method" onclick="selectMethod(this)">
                            <i class="fa-solid fa-credit-card"></i>
                            <div>
                                <h4>Visa / Mastercard</h4>
                                <p>Credit or Debit Card</p>
                            </div>
                            <i class="fa-solid fa-circle-check check"></i>
                        </div>
                    </div>
                </div>
            `;

            payBtn.style.display = 'block';
            payBtn.disabled = false;
            payBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Confirm & Pay $${totalAmount.toLocaleString()}`;
        }

        window.selectMethod = (element) => {
            document.querySelectorAll('.method').forEach(m => m.classList.remove('selected'));
            element.classList.add('selected');
        };

        window.processPayment = async () => {
            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Payment...';

            try {
                const user = await getCurrentUser();
                if (!user) throw new Error("Session expired");

                // Generate Order Number
                const orderNumber = `MP-${new Date().getFullYear()}-${Math.floor(100000 + Math.random() * 900000)}`;

                // 1. Create Order
                const { data: orderData, error: orderError } = await supabase
                    .from('orders')
                    .insert([{
                        order_number: orderNumber,
                        buyer_id: user.id,
                        supplier_id: currentItem.supplier_id,
                        total_amount: totalAmount,
                        destination_address: dest,
                        delivery_address: dest, // Required by schema
                        status: 'pending'
                    }])
                    .select();

                if (orderError) throw orderError;
                const newOrderId = orderData[0].id;

                // 2. Create Escrow Account (The wallet for this order)
                const { data: escAccountData, error: escAccountError } = await supabase
                    .from('escrow_accounts')
                    .insert([{
                        order_id: newOrderId,
                        total_amount: totalAmount,
                        status: 'funded'
                    }])
                    .select();

                if (escAccountError) throw escAccountError;
                const escrowAccountId = escAccountData[0].id;

                // 3. Create Escrow Transaction (The ledger entry)
                const { error: escError } = await supabase
                    .from('escrow_transactions')
                    .insert([{
                        escrow_account_id: escrowAccountId,
                        order_id: newOrderId,
                        buyer_id: user.id,
                        supplier_id: currentItem.supplier_id,
                        from_user_id: user.id,
                        type: 'escrow_funding',
                        amount: totalAmount,
                        status: 'funded'
                    }]);

                if (escError) throw escError;

                // 4. Decrement available inventory
                const newQty = Math.max(0, (currentItem.quantity - qty));
                await supabase
                    .from('inventory_items')
                    .update({ quantity: newQty })
                    .eq('id', currentItem.id);

                showToast('Payment successful! Escrow funded.', 'success');
                
                setTimeout(() => {
                    window.location.href = `payment-success.html?order=${orderNumber}`;
                }, 1500);

            } catch (error) {
                console.error('Payment error:', error);
                showToast('Payment failed: ' + error.message, 'error');
                payBtn.disabled = false;
                payBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Confirm & Pay ZMW ${totalAmount.toLocaleString()}`;
            }
        };

        loadPaymentDetails();
    </script>
</body>
</html>
